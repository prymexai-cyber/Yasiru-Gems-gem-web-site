<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact us | Yasiru Gems</title>
<meta name="description" content="Chat with Yasiru Gems on WhatsApp about genuine gemstones.">
<meta property="og:title" content="Contact us | Yasiru Gems">
<meta property="og:description" content="Chat with Yasiru Gems on WhatsApp about genuine gemstones.">
<meta property="og:type" content="website">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/bodoni-moda-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="contact">
<main>
<section class="hero" data-hero="contact">
  <div class="hero-media" aria-hidden="true"></div>
  <div class="hero-copy wrap"><div class="hero-glass">
    <h1 class="split">Talk to us directly</h1>
    <p class="lead reveal-hero">WhatsApp is the fastest way to reach Yasiru Gems.</p>
  </div></div>
</section>
<section class="section wrap contact-grid">
  <div class="contact-card rise" data-bgvideo="contactcard"><div class="band-glass">
    <h2>WhatsApp</h2>
    <a class="phone" data-phone href="#">+1 (402) 808-7890</a>
    <p>Ask about a stone, or tell us what you are looking for.</p>
    <a class="btn btn-white" data-wa="Hello Yasiru Gems, I have a question." href="#">Open WhatsApp</a>
  </div></div>
  <form class="glass-card msg rise" id="msg">
    <h2>Send a message</h2>
    <p class="hint">Your message opens in WhatsApp, ready to send.</p>
    <label>Your name<input name="name" required autocomplete="name"></label>
    <label>Your message<textarea name="text" rows="5" required></textarea></label>
    <button class="btn btn-solid">Continue in WhatsApp</button>
  </form>
</section>
</main>
<script src="pryme.js" defer></script>
<script src="assets/js/gsap.min.js" defer></script>
<script src="assets/js/ScrollTrigger.min.js" defer></script>
<script src="assets/js/site.js" defer></script>
</body>
</html>
