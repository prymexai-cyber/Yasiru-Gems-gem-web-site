<section class="hero hero-short" data-hero="track">
  <div class="hero-media" aria-hidden="true"></div>
  <div class="hero-copy wrap"><div class="hero-glass">
    <h1 class="split">Track your order</h1>
    <p class="lead reveal-hero">Enter your order number and the phone number you used at checkout.</p>
  </div></div>
</section>
<section class="section wrap shop-section">
  <form class="glass-card track-form" id="trackForm" novalidate>
    <label>Order number<input name="orderNo" required inputmode="numeric" placeholder="1450"></label>
    <label>Phone number<input name="phone" required inputmode="tel" placeholder="077 123 4567"></label>
    <button class="btn btn-solid">Track order</button>
    <p class="form-error hidden" role="alert"></p>
  </form>
  <p class="hint hidden" id="trackAccount">You are signed in. You can also see all your orders in <a href="account.html">My account</a>.</p>
  <div id="trackOut"></div>
</section>
</main>
